name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build & publish Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle
        run: npm run build

      - name: Build installer + publish draft release
        run: npx electron-builder --win --publish always
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fallback upload if no draft release existed
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.yml
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  npm:
    name: Publish ultr0n CLI to npm
    runs-on: ubuntu-latest
    needs: release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Build web bundle for the CLI to serve
        run: |
          npm ci
          npm run build

      - name: Stage the package (cli + bridge + dist)
        run: |
          V="${GITHUB_REF_NAME#v}"
          mkdir -p pkg/bridge
          cp cli/package.json cli/cli.mjs cli/README.md pkg/
          cp bridge/ultron-bridge.mjs pkg/bridge/
          cp -r dist pkg/dist
          node -e "const p=require('./cli/package.json');p.version=process.env.GITHUB_REF_NAME.replace(/^v/,'');require('fs').writeFileSync('pkg/package.json',JSON.stringify(p,null,2))"
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}

      - name: Smoke-test the staged package
        run: |
          npm install -g ./pkg
          ultr0n version
          ultr0n doctor || true
          npm uninstall -g ultr0n

      - name: Publish
        run: npm publish pkg/ --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
